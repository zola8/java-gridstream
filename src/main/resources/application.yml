spring:
  application:
    name: gridstream

  datasource:
    url: jdbc:postgresql://localhost:5432/gridstream
    username: gridstream
    password: gridstream
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always


gridstream:
  grid:
    rows: 10
    cols: 10
  simulation:
    avatar-count: 3
    tick-ms: 500

logging:
  level:
    root: INFO
    com.example.gridstream: DEBUG
    org.apache.kafka: WARN
